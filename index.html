<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>光學透鏡成像模擬器</title>
  <style>
    body { font-family: "微軟正黑體", sans-serif; text-align: center; background-color: #f4f4f9; }
    canvas { background-color: white; border: 2px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .controls { margin: 20px; padding: 15px; background: white; border-radius: 8px; display: inline-block; }
  </style>
</head>
<body>

  <h2>🔍 光學透鏡成像模擬器</h2>
  
  <div class="controls">
    <label>透鏡種類：</label>
    <select id="lensType" onchange="draw()">
      <option value="convex">凸透鏡 (會聚)</option>
      <option value="concave">凹透鏡 (發散)</option>
    </select>
    &nbsp;&nbsp;&nbsp;
    <label>物體距離：</label>
    <input type="range" id="objDist" min="30" max="350" value="250" oninput="draw()">
  </div>

  <br>
  <canvas id="simCanvas" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById("simCanvas");
    const ctx = canvas.getContext("2d");
    const lensSelect = document.getElementById("lensType");
    const objDistSlider = document.getElementById("objDist");

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const isConvex = lensSelect.value === "convex";
      const p = parseInt(objDistSlider.value); // 物距
      const f_val = 100; // 焦距絕對值
      const f = isConvex ? f_val : -f_val;     
      
      const cx = 400, cy = 200; // 鏡心座標
      const objH = 60;          // 物體高度
      const objX = cx - p;      // 物體X座標
      const objY = cy - objH;   // 物體頂端Y座標

      // 1. 畫主軸與透鏡形狀
      ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(800, cy); ctx.strokeStyle = "#ccc"; ctx.stroke();
      
      ctx.beginPath();
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      if (isConvex) {
        ctx.ellipse(cx, cy, 25, 150, 0, 0, Math.PI * 2);
      } else {
        ctx.moveTo(cx - 20, cy - 150); ctx.lineTo(cx + 20, cy - 150);
        ctx.bezierCurveTo(cx - 5, cy - 80, cx - 5, cy + 80, cx + 20, cy + 150);
        ctx.lineTo(cx - 20, cy + 150);
        ctx.bezierCurveTo(cx + 5, cy + 80, cx + 5, cy - 80, cx - 20, cy - 150);
      }
      ctx.fill();
      ctx.beginPath(); ctx.moveTo(cx, 50); ctx.lineTo(cx, 350); ctx.lineWidth = 1.5; ctx.strokeStyle = "#888"; ctx.stroke();
      ctx.lineWidth = 1;

      // 2. 標示焦點 (F) 與 兩倍焦距 (2F)
      ctx.fillStyle = "#333"; ctx.font = "14px Arial";
      ctx.fillText("F", cx - f_val - 5, cy + 20); ctx.fillText("F", cx + f_val - 5, cy + 20);
      ctx.fillText("2F", cx - f_val*2 - 8, cy + 20); ctx.fillText("2F", cx + f_val*2 - 8, cy + 20);
      ctx.beginPath(); 
      ctx.arc(cx - f_val, cy, 3, 0, Math.PI*2); ctx.arc(cx + f_val, cy, 3, 0, Math.PI*2);
      ctx.arc(cx - f_val*2, cy, 3, 0, Math.PI*2); ctx.arc(cx + f_val*2, cy, 3, 0, Math.PI*2);
      ctx.fill();

      // 3. 計算像的位置與大小
      const q = (p * f) / (p - f); // 像距
      const mag = -q / p;          // 放大率
      const imgX = cx + q;
      const imgY = cy - (objH * mag);

      // 4. 畫光線 (修正線段長度)
      ctx.strokeStyle = "#ff4757"; ctx.lineWidth = 1.5;
      
      // === 光線 1：平行光 ===
      ctx.beginPath(); ctx.moveTo(objX, objY); ctx.lineTo(cx, objY); ctx.stroke();
      if (isConvex) {
        // 凸透鏡折射，讓線延伸到底 (x=800)
        const endX = 800;
        const endY = objY + ((endX - cx) / f_val) * (cy - objY);
        ctx.beginPath(); ctx.moveTo(cx, objY); ctx.lineTo(endX, endY); ctx.stroke();
        
        if (q < 0) { ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(cx, objY); ctx.lineTo(imgX, imgY); ctx.stroke(); ctx.setLineDash([]); }
      } else {
        const m1_v = (objY - cy) / (cx - (cx - f_val));
        const endX = 800;
        const endY = objY + (endX - cx) * m1_v;
        ctx.beginPath(); ctx.moveTo(cx, objY); ctx.lineTo(endX, endY); ctx.stroke();
        ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(cx, objY); ctx.lineTo(cx - f_val, cy); ctx.stroke(); ctx.setLineDash([]);
      }

      // === 光線 2：穿過鏡心的光 (修正長度) ===
      // 計算從物件頂端穿過鏡心的斜率
      const slope = (cy - objY) / (cx - objX);
      const endX2 = 800; // 延伸到右邊邊界
      const endY2 = cy + (endX2 - cx) * slope;
      
      ctx.beginPath(); ctx.moveTo(objX, objY); ctx.lineTo(endX2, endY2); ctx.stroke();
      
      if (isConvex && q < 0) {
        ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(imgX, imgY); ctx.stroke(); ctx.setLineDash([]);
      }
      
      // 5. 畫出物體 (藍色箭頭)
      ctx.fillStyle = "#1e90ff";
      ctx.fillRect(objX - 2, objY, 4, objH);
      ctx.beginPath(); ctx.moveTo(objX, objY - 8); ctx.lineTo(objX - 6, objY); ctx.lineTo(objX + 6, objY); ctx.fill();

      // 6. 畫出像 (橘色箭頭)
      ctx.fillStyle = "#ffa502";
      let isReal = q > 0;
      let imgTopY = isReal ? cy + Math.abs(objH * mag) : imgY;
      ctx.fillRect(imgX - 2, Math.min(cy, imgTopY), 4, Math.abs(objH * mag));
      ctx.beginPath();
      if (isReal) { 
         ctx.moveTo(imgX, imgTopY + 8); ctx.lineTo(imgX - 6, imgTopY); ctx.lineTo(imgX + 6, imgTopY);
      } else { 
         ctx.moveTo(imgX, imgTopY - 8); ctx.lineTo(imgX - 6, imgTopY); ctx.lineTo(imgX + 6, imgTopY);
      }
      ctx.fill();
      
      // 顯示狀態
      ctx.fillStyle = "#2f3542"; ctx.font = "bold 18px 微軟正黑體";
      const imageType = isReal ? "倒立實像 (真實光線交會)" : "正立虛像 (虛線延伸交會)";
      ctx.fillText(`目前狀態: ${imageType}`, 20, 30);
    }

    draw(); 
  </script>
</body>
</html>
