<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>安培右手定則模擬器</title>
  <style>
    body { font-family: "微軟正黑體", sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    canvas { background-color: #fafafa; border: 2px solid #ddd; border-radius: 8px; margin-top: 10px; cursor: crosshair; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin: 15px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef; }
    .control-group { display: flex; align-items: center; gap: 8px; }
    button { padding: 8px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; background: #e2e8f0; color: #333; }
    button.active { background: #3b82f6; color: white; }
    input[type="range"] { width: 120px; }
    
    /* 教育說明面板樣式 */
    .edu-panel { text-align: left; background: #eef2ff; border-left: 5px solid #6366f1; padding: 15px 20px; border-radius: 4px; margin-top: 20px; line-height: 1.6; }
    .edu-panel h3 { margin-top: 0; color: #4338ca; display: flex; align-items: center; gap: 8px; }
    .edu-panel p { margin: 8px 0; color: #334155; }
    .math-text { font-family: "Times New Roman", serif; font-size: 1.1em; font-style: italic; font-weight: bold; color: #b91c1c; }
  </style>
</head>
<body>

<div class="container">
  <h2>🧲 安培右手定則俯視圖實驗</h2>
  
  <div class="controls">
    <div class="control-group">
      <label>電源總開關：</label>
      <button id="btnPowerOn" onclick="setPower(true)">通電</button>
      <button id="btnPowerOff" class="active" onclick="setPower(false)">關閉</button>
    </div>
    
    <div class="control-group">
      <label>電流方向：</label>
      <button id="btnDirUp" class="active" onclick="setDir('up')">向上 (出紙面)</button>
      <button id="btnDirDown" onclick="setDir('down')">向下 (入紙面)</button>
    </div>

    <div class="control-group">
      <label>觀察物：</label>
      <button id="btnMatCompass" class="active" onclick="setMaterial('compass')">磁針</button>
      <button id="btnMatIron" onclick="setMaterial('iron')">鐵粉</button>
    </div>

    <div class="control-group" id="distControl">
      <label>磁針距離 (<span id="distVal">120</span>)：</label>
      <input type="range" id="sliderDist" min="40" max="250" value="120" oninput="updateDist()">
    </div>
  </div>

  <canvas id="simCanvas" width="900" height="600"></canvas>

  <!-- 教育說明面板 -->
  <div class="edu-panel">
    <h3>👨‍🔬 實驗原理與觀察重點</h3>
    <p><strong>1. 安培右手定則：</strong> 調整滑桿時，磁針距離導線愈遠，磁針偏轉減弱，此時「固定強度的地球磁場」會將磁針的N極(紅色)逐漸往北方偏轉。</p>
    <p><strong>2. 磁針觀察：</strong> 畫面中 6 個放大的磁針剛好構成一個六邊形圓環，且距離導線愈遠，偏轉角度愈小。</p>
    <p><strong>3. 鐵粉分佈：</strong> 切換至「鐵粉」並通電，可觀察到鐵粉受磁力影響，呈現「外疏內密」同心圓排列，可以看出距離導線愈近，磁場愈強。</p>
  </div>
</div>

<script>
  const canvas = document.getElementById("simCanvas");
  const ctx = canvas.getContext("2d");
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  // 狀態變數
  let isPowered = false;
  let currentDir = 'up'; 
  let material = 'compass'; 
  let compassDist = 120;
  
  // 鐵粉資料陣列 
  const ironFilings = [];
  const numFilings = 2500; 
  
  // 初始化隨機鐵粉 (加入當下位置的記錄，以利動畫過渡)
  function initIronFilings() {
    ironFilings.length = 0;
    const numRings = 14; 
    
    for (let i = 0; i < numFilings; i++) {
      // 1. 先決定通電後的「目標位置」
      // 利用 Math.pow 讓機率大幅集中在內圈，達成你想要的「外疏內密」效果
      let ringIndex = Math.floor(Math.pow(Math.random(), 1.6) * numRings);
      let baseRadius = 20 + (ringIndex * 15) + (ringIndex * ringIndex * 2.5);
      
      let angle = Math.random() * Math.PI * 2;
      
      // 給同心圓加上微小擾動，看起來更自然
      let onRadius = baseRadius + (Math.random() - 0.5) * 8;
      let onX = cx + Math.cos(angle) * onRadius;
      let onY = cy + Math.sin(angle) * onRadius;

      // 2. 決定斷電時的「初始位置」
      // 讓鐵粉在目標位置附近 (半徑 35 像素內) 隨機打散
      // 這樣通電時，鐵粉只會移動一小段距離，不會滿場飛！
      let scatterDist = Math.random() * 35; 
      let scatterAngle = Math.random() * Math.PI * 2;
      let offX = onX + Math.cos(scatterAngle) * scatterDist;
      let offY = onY + Math.sin(scatterAngle) * scatterDist;
      
      ironFilings.push({
        offX: offX,
        offY: offY,
        onX: onX,
        onY: onY,
        currX: offX,
        currY: offY,
        size: Math.random() * 1.5 + 0.5
      });
    }
  }
  
  initIronFilings();

  // 控制按鈕 (移除原本手動呼叫的 draw，交給動畫引擎處理)
  function setPower(state) {
    isPowered = state;
    document.getElementById('btnPowerOn').className = state ? 'active' : '';
    document.getElementById('btnPowerOff').className = !state ? 'active' : '';
  }

  function setDir(dir) {
    currentDir = dir;
    document.getElementById('btnDirUp').className = dir === 'up' ? 'active' : '';
    document.getElementById('btnDirDown').className = dir === 'down' ? 'active' : '';
  }

  function setMaterial(mat) {
    material = mat;
    document.getElementById('btnMatCompass').className = mat === 'compass' ? 'active' : '';
    document.getElementById('btnMatIron').className = mat === 'iron' ? 'active' : '';
    document.getElementById('distControl').style.opacity = mat === 'compass' ? '1' : '0.3';
  }

  function updateDist() {
    compassDist = parseInt(document.getElementById('sliderDist').value);
    document.getElementById('distVal').innerText = compassDist;
  }

  function drawCompass(x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const size = 18; 
    
    // N 極 (紅色)
    ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(-size/2.5, 0); ctx.lineTo(size/2.5, 0);
    ctx.fillStyle = "#db3949"; ctx.fill();
    // S 極 (灰色)
    ctx.beginPath(); ctx.moveTo(0, size); ctx.lineTo(-size/2.5, 0); ctx.lineTo(size/2.5, 0);
    ctx.fillStyle = "#d7dbdb"; ctx.fill(); ctx.strokeStyle = "#ccc"; ctx.stroke();
    // 中心黑點
    ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fillStyle = "#333"; ctx.fill();
    ctx.restore();
  }

  // 繪圖核心與動畫迴圈
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 畫桌面背景輔助線
    ctx.strokeStyle = "#eee"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();

    if (material === 'iron') {
      // === 鐵粉模式 ===
      ctx.fillStyle = "#333";
      for (let i = 0; i < numFilings; i++) {
        let p = ironFilings[i];
        
        // 決定目標位置
        let targetX = isPowered ? p.onX : p.offX;
        let targetY = isPowered ? p.onY : p.offY;
        
        // 【動畫平滑過渡】：利用 Lerp 讓當前位置緩慢逼近目標位置
        p.currX += (targetX - p.currX) * 0.05;
        p.currY += (targetY - p.currY) * 0.05;
        
        ctx.beginPath();
        ctx.arc(p.currX, p.currY, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // === 磁針模式 ===
      ctx.strokeStyle = "rgba(0, 0, 0, 0.05)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, compassDist, 0, Math.PI * 2); ctx.stroke();

      const numCompasses = 6;
      for (let i = 0; i < numCompasses; i++) {
        const theta = (i * Math.PI * 2) / numCompasses;
        const pX = cx + Math.cos(theta) * compassDist;
        const pY = cy + Math.sin(theta) * compassDist;
        
        let finalAngle = 0; 
        
        if (isPowered) {
           const bEarthX = 0; 
           // 引入動態視覺平滑技巧：距離越遠，地磁越強
           const bEarthY = -25 * (compassDist / 250); 
           
           const bWireMag = 3000 / compassDist; 
           
           let tangentDirX, tangentDirY;
           
           // 調整為符合 Canvas 座標系 (Y軸向下) 的向量算法
           if (currentDir === 'up') { 
             tangentDirX = Math.sin(theta);
             tangentDirY = -Math.cos(theta);
           } else { 
             tangentDirX = -Math.sin(theta);
             tangentDirY = Math.cos(theta);
           }
           
           const bWireX = tangentDirX * bWireMag;
           const bWireY = tangentDirY * bWireMag;
           
           // 維持向外的平滑翻轉推力 (確保奇異點平滑過渡)
           const radialBias = compassDist * 0.015; 
           const biasX = Math.cos(theta) * radialBias;
           const biasY = Math.sin(theta) * radialBias;
           
           const netX = bEarthX + bWireX + biasX;
           const netY = bEarthY + bWireY + biasY;
           
           finalAngle = Math.atan2(netY, netX) + Math.PI/2; 
        }
        
        drawCompass(pX, pY, finalAngle);
      }
    }

    // 畫導線截面
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI * 2);
    ctx.fillStyle = "#fbbf24"; 
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#b45309";
    ctx.stroke();

    ctx.fillStyle = "black";
    ctx.strokeStyle = "black";
    if (currentDir === 'up') {
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(cx - 6, cy - 6); ctx.lineTo(cx + 6, cy + 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 6, cy - 6); ctx.lineTo(cx - 6, cy + 6); ctx.stroke();
    }

    // 地磁圖示 (統一在右上角繪製一次)
    ctx.save();
    const earthIconX = canvas.width - 60;
    const earthIconY = 40;
    
    ctx.beginPath();
    ctx.moveTo(earthIconX, earthIconY + 20);
    ctx.lineTo(earthIconX, earthIconY - 20);
    ctx.strokeStyle = "#0ea5e9"; 
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(earthIconX, earthIconY - 22);
    ctx.lineTo(earthIconX - 7, earthIconY - 8);
    ctx.lineTo(earthIconX + 7, earthIconY - 8);
    ctx.fillStyle = "#0ea5e9";
    ctx.fill();

    ctx.font = "bold 18px 微軟正黑體";
    ctx.fillStyle = "#333";
    ctx.textAlign = "center";
    ctx.fillText("北方", earthIconX, earthIconY + 40);
    ctx.restore();

    // 啟動動畫引擎，不斷循環渲染
    requestAnimationFrame(draw);
  }

  // 初始呼叫，正式啟動整套程式
  draw();
</script>
</body>
</html>
